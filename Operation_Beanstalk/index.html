<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Beanstalk</title>

<style>
body {
	margin: 0;
	padding: 0;
	background: #1a1a2e;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	overflow: hidden;
	color: white;
}

#game-container {
	position: relative;
	width: 800px;
	height: 600px;
	border: 4px solid #16213e;
	box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
	background: #0f3460;
	border-radius: 8px;
	overflow: hidden;
}

#gameCanvas {
	display: block;
	width: 100%;
	height: 100%;
	background: linear-gradient(to bottom, #0f3460, #16213e);
}

#ui-layer {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	padding: 20px;
	display: flex;
	justify-content: space-between;
	pointer-events: none;
	box-sizing: border-box;
	z-index: 5;
}

.stat-box {
	color: #e94560;
	font-weight: bold;
	font-size: 1.2rem;
	text-shadow: 2px 2px #000;
	letter-spacing: 1px;
}

#overlay {
	position: absolute;
	inset: 0;
	background: rgba(15, 52, 96, 0.9);
	display: flex;
	justify-content: center;
	align-items: center;
	z-index: 10;
}

.modal {
	text-align: center;
	padding: 40px;
	background: #16213e;
	border: 2px solid #e94560;
	border-radius: 15px;
	box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
	transition: all 0.3s ease;
}

.modal:hover {
	color: #fb6782;
	border: 2px solid #fb6782;
	transform: translateY(-2px);
	box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5);
}

h1 {
	margin-top: 0;
	font-size: 3rem;
	color: #e94560;
	text-transform: uppercase;
	letter-spacing: 4px;
}

p {
	color: #8da2fb;
	margin-bottom: 30px;
}

button {
	background: white;
	border: none;
	color: #e94560;
	padding: 15px 40px;
	font-size: 1.2rem;
	font-weight: bold;
	border-radius: 50px;
	cursor: pointer;
	transition: all 0.3s ease;
	box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
}

button:hover {
	background: #e94560;
	color: white;
	transform: translateY(-2px);
	box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
}

.fadeable-element {
	opacity: 1;
	transition: opacity 1s ease-out;
}

.is-faded {
	opacity: 0;
}

.fadeinable-element {
	opacity: 0;
	transition: opacity 1s ease-in;
}

.is-fadedin {
	opacity: 1;
}

.hide {
	display: none;
}

#player {
	position: absolute;
	z-index: 2;
	width: 50px;
}

#laser {
	position: absolute;
	z-index: 10;
	width: 200px;
	height: 1000px;
}

#enemy {
	position: absolute;
	z-index: 50;
	width: 40px;
	opacity: 1;
	height: auto;
}
 
#lose {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	z-index: 999;
	width: 800px;
	height: 600px;
}
</style>
</head>

<body>

<div id="game-container">

<div id="ui-layer" class="fadeinable-element">
	<div class="stat-box">SCORE: <span id="score">0000</span></div>
	<div class="stat-box">LIVES: <span id="lives">❤❤❤</span></div>
</div>

<img class="fadeinable-element" id="player" src="https://pineapple-productions.net/Operation_Beanstalk/player.png" />
<img class="fadeinable-element" id="enemy" src="https://pineapple-productions.net/Operation_Beanstalk/enemy.png" />

<div id="overlay" class="fadeable-element">
	<div class="modal">
		<h1>Operation Beanstalk</h1>
		<p>Use WASD/Arrow Keys to move, Space to dash, and ram into enemies to destroy them.</p>
		<button id="start-btn">START MISSION</button>
	</div>
</div>

<img id="lose" src="https://pineapple-productions.net/Operation_Beanstalk/lose.png" />
<canvas id="gameCanvas"></canvas>

</div>

<script>
const player = document.getElementById("player");
const startButton = document.getElementById("start-btn");
const startMenu = document.getElementById("overlay");
const hud = document.getElementById("ui-layer");
const enemy = document.getElementById("enemy");
const scoreDisplay = document.getElementById("score");
const healthDisplay = document.getElementById("lives");
const loseScreen = document.getElementById("lose");

const keys = {};
const movementKeys = ["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"];

let posX = 375;
let posY = 500;
let score = 0;
let health = 3;
let enemyX = 100;
let enemyY = -50;
let lastTime = 0;
let offTime = 0;
let dashCooldown = 0;
let lastLook = "u";
let started = false;
let lost = false;

loseScreen.classList.add("hide");

startButton.addEventListener("click", () => {
	startMenu.style.display = "none";
	hud.classList.add("is-fadedin");
	player.classList.add("is-fadedin");
	started = true;
	killEnemy();
});

window.addEventListener("keydown", e => {
	keys[e.code] = true;
	if (!movementKeys.includes(e.code)) keys["isShootingKey"] = true;
});

window.addEventListener("keyup", e => {
	keys[e.code] = false;
	if (!movementKeys.includes(e.code)) keys["isShootingKey"] = false;
});

function gameLoop(currentTime) {
	if (!lastTime) lastTime = currentTime;
	healthDisplay.innerText = ["💀","❤","❤❤","❤❤❤"][health] || "💀";
	scoreDisplay.innerText = score.toString().padStart(4,"0");

	if (keys["ArrowLeft"] || keys["KeyA"]) move(false,-5);
	if (keys["ArrowRight"] || keys["KeyD"]) move(false,5);
	if (keys["ArrowUp"] || keys["KeyW"]) move(true,-5);
	if (keys["ArrowDown"] || keys["KeyS"]) move(true,5);
	if (keys["Space"]) dash(currentTime);

	posX = Math.max(0, Math.min(posX, 750));
	posY = Math.max(0, Math.min(posY, 550));
	enemyX = Math.max(0, Math.min(enemyX, 750));

	player.style.left = posX + "px";
	player.style.top = posY + "px";

	enemy.style.left = enemyX + "px";
	enemy.style.top = enemyY + "px";
	
	enemyY += (currentTime - lastTime) * 0.225;

	if (!started) {
		enemyY = -50;
		player.classList.add("hide");
	} else {
		player.classList.remove("hide");
	}

	if (enemyY >= 600) {
		killEnemy();
		health--;
		if (health === 0) lose();
	}

	if (Math.abs(enemyX - posX) < 20 && Math.abs(enemyY - posY) < 20) {
		killEnemy();
	}

	lastTime = currentTime;

	if (!lost) requestAnimationFrame(gameLoop);
}

function move(y, dis) {
	if (y) posY += dis;
	else posX += dis;

	if (y && dis > 0) lastLook = "d";
	else if (y && dis < 0) lastLook = "u";
	else if (!y && dis > 0) lastLook = "r";
	else lastLook = "l";
}

function dash(time) {
	if (dashCooldown <= time) {
		dashCooldown = time + 1000;
		const dist = 150;
		if (lastLook === "u") posY -= dist;
		if (lastLook === "d") posY += dist;
		if (lastLook === "l") posX -= dist;
		if (lastLook === "r") posX += dist;
	}
}

function killEnemy() {
	enemyX = Math.random() * 600 + 50;
	enemyY = -50;
	score += 20;
}

function lose() {
	lost = true;
	player.classList.add("hide");
	enemy.classList.add("hide");
	hud.classList.add("hide");
	loseScreen.classList.remove("hide");
	window.addEventListener("click", () => location.reload());
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
