<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #fffaf0;
      color: #333;
    }

    header {
      background: #ffcc33;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      
      /* Prevent header items from moving */
      flex-shrink: 0;       /* prevent shrinking */
      min-height: 70px;     /* fixed height matching content */
    }

    header img {
      height: 50px;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      line-height: 50px; /* vertically align with logo */
      flex-shrink: 0;
    }

    nav {
      background: #ffd966;
      padding: 0.5rem 2rem;
    }

    #nav-menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 1.5rem;
      cursor: pointer;
    }

    #nav-menu li {
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    #nav-menu li.active,
    #nav-menu li:hover {
      background-color: #ffb84d;
      font-weight: bold;
    }

    main {
      padding: 1.5rem 2rem;
      max-width: 800px;
      margin: 0 auto;
      overflow: hidden;
      transition: height 0.4s ease;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    section h2 {
      color: #cc6600;
    }

    ul {
      padding-left: 1.2rem;
    }

    li {
      margin: 0.5rem 0;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 1rem 0;
      background: #ffcc33;
      font-size: 0.9rem;
      box-shadow: 0 -1px 5px rgba(0,0,0,0.1);
    }
    </style>
  </head>
  <body>
    <header>
    <div class="logo">
      <!-- Replace 'logo.png' with your logo file -->
      <img src="https://www.pineapple-productions.net/images/logo.png" alt="Pineapple Productions Logo" />
    </div>
    <h1>Pineapple Productions</h1>
    </header>
    <h1>Give us a second!</h1>
    <p>We are currently checking your membership status. If this does not redirect you soon, refresh the page or contact support.</p>
    <footer>
    <p>© 2026 Pineapple Productions</p>
  </footer>
    <script>
      const allowedUsers = [];
      const games = ["Kooking_Gaem_Cool", "Operation_Beanstalk"];
      const everyoneIn = true;
      const params = new URLSearchParams(window.location.search);
      const game = params.get("game");
      const user = params.get("u");
      if(everyoneIn){
        window.location.href = "https://pineapple-productions.net/"+games[game-1];
      }
      else
      {
        if(userAllowed(user)){
          window.location.href = "https://pineapple-productions.net/"+games[game-1];
        }
        else
        {
          window.location.href = "https://pineapple-productions.net/Sign_In";
        }
      }
      function userAllowed(userToCheck){
        for(let i = 0; i < allowedUsers.length; i++){
          if(allowedUsers[i] == userToCheck){
            return true;
          }
        }
        return false;
      }
    </script>
  </body>
</html>
