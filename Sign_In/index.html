<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-box {
    background: #1f2937;
    padding: 30px;
    border-radius: 12px;
    width: 300px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

.register-btn {
    background: #2563eb;
    color: white;
}

.login-btn {
    background: #16a34a;
    color: white;
}

.logout-btn {
    background: #dc2626;
    color: white;
}

.status {
    margin-top: 15px;
    text-align: center;
}
</style>
</head>
<body>

<div class="login-box">

    <h1>Account</h1>

    <input
        id="username"
        type="text"
        placeholder="Username"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button
        class="register-btn"
        onclick="register()"
    >
        Register
    </button>

    <button
        class="login-btn"
        onclick="login()"
    >
        Login
    </button>

    <button
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>

    <div
        class="status"
        id="status"
    >
        Not logged in
    </div>

</div>

<script>

// REPLACE THIS WITH YOUR WORKER URL
const API_URL =
"https://YOUR-WORKER.workers.dev";

// Update UI
function setStatus(text) {
    document.getElementById("status")
        .innerText = text;
}

// REGISTER
async function register() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (!username || !password) {
        alert("Enter username and password");
        return;
    }

    try {

        const response = await fetch(
            API_URL + "/register",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            alert("Account created!");

        } else {

            alert(data.error);

        }

    } catch (err) {

        console.error(err);
        alert("Register failed");

    }
}

// LOGIN
async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (!username || !password) {
        alert("Enter username and password");
        return;
    }

    try {

        const response = await fetch(
            API_URL + "/login",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            // Save token
            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "username",
                username
            );

            setStatus(
                "Logged in as " + username
            );

            alert("Logged in!");

        } else {

            alert(data.error);

        }

    } catch (err) {

        console.error(err);
        alert("Login failed");

    }
}

// LOGOUT
function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("username");

    setStatus("Not logged in");

    alert("Logged out");
}

// Auto-login display
window.onload = () => {

    const username =
        localStorage.getItem("username");

    if (username) {

        setStatus(
            "Logged in as " + username
        );

    }
};

</script>

</body>
</html>
