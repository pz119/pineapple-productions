<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dit It</title>

    <style>
        body {
            background: #1e1e1e;
            color: #00ff88;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: white;
        }

        #console {
            width: 100%;
            height: 400px;
            background: black;
            border: 2px solid #00ff88;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        #inputBox {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            background: #111;
            color: #00ff88;
            border: 2px solid #00ff88;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00ff88;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #00cc66;
            }
        .legacy{
            position: fixed;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <h1>Dig It</h1>

    <div id="console"></div>

    <input type="text" id="inputBox" placeholder="Type here..." />
    <button onclick="submitInput()">Enter</button>
    <button class="legacy" id="legacy">Back to original</button>
    <script>const digResults = ["weapon","snake","scorpion",3,5,1,"money","money","snake","medkit"];
const expResults = ["trader","shoes","money",12,"wolf","wolf","wolf","medstim","wolf","wolf","wolf","weapon","tnt","wolf","wolf","alpha wolf"];
const scavResults = ["money","lava","money","","","","","","","","","","","turboShovel","mugger","mugger","medstim","dead animal","landmine","weapon","weapon","weapon","weapon","weapon"];
const impDigResults = ["weapon","scorpion",3,5,1,"money","money","medstim"];
const inescapable = ["snake","wolf","alpha wolf"];

let health = 10;
let food = 0;
let stimHealth = health;
let money = 0;

let hasTurbo = false;
let hasWeapon = false;
let hasShoes = false;
let hasVial = false;
let hasBoom = false;
let hasKey = false;
let hasMap = false;
let hasStim = false;
let hasPass = false;
document.addEventListener("keydown", function(event) {if (event.key === "Enter") submitInput();});
let waitingAction = null;
const legacy = document.getElementById("legacy");
legacy.addEventListener("click", function(){
    window.location.href = "https://pineapple-productions.net/Dig_It/";
});
const consoleBox = document.getElementById("console");
const inputBox = document.getElementById("inputBox");

function print(text) {
    consoleBox.innerHTML += text + "\n";
    consoleBox.scrollTop = consoleBox.scrollHeight;
}

function rand(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function submitInput() {
    const input = inputBox.value.trim();
    inputBox.value = "";

    print("> " + input);

    if (waitingAction) {
        waitingAction(input);
    }
}

function ask() {

    if (health <= 0) {
        print("You died! Restarting...");
        restart();
        return;
    }

    print(`Health: ${health}, Money: ${money}, Food: ${food}`);

    if (health < stimHealth && hasStim) {
        health = stimHealth;
        hasStim = false;
        print("You dodged the health decrease.");
    }

    stimHealth = health;

    print("Would you like to dig, explore, scavenge, escape, or eat?");

    waitingAction = function(input) {
        input = input.toLowerCase();

        if (input === "dig") {
            dig();
        } else if (input === "explore") {
            explore();
        } else if (input === "scavenge") {
            scavenge();
        } else if (input === "escape") {
            escapeGame();
        } else if (input === "eat") {
            eat();
        } else {
            print("Sorry, I don't understand.");
            ask();
        }
    };
}

function restart() {
    health = 10;
    food = 0;
    money = 0;

    hasWeapon = false;
    hasShoes = false;
    hasBoom = false;
    hasKey = false;
    hasTurbo = false;
    hasMap = false;
    hasStim = false;
    hasPass = false;

    print("Welcome to ...");
    print("DIG IT o yea");
    print("Try to escape the forest!");

    ask();
}

function eat() {
    if (food === 0) {
        print("You don't have any food.");
    } else {
        print("You ate some food.");
        health += food;
        food = 0;
    }

    ask();
}

function dig() {
    let res = hasTurbo ? rand(impDigResults) : rand(digResults);

    if (typeof res === "number") {
        print("You found some food.");
        food += res;
        ask();
        return;
    }

    if (res === "money") {
        print("You found ten dollars.");
        money += 10;
        ask();
        return;
    }

    if (res === "weapon") {
        print("You found a weapon.");
        hasWeapon = true;
        ask();
        return;
    }

    if (res === "medkit") {
        print("You found a medkit. Full health!");
        health = 10;
        ask();
        return;
    }

    print("You encountered a " + res + ".");
    print("Fight or run?");

    waitingAction = function(input) {

        if (input === "fight") {
            if (hasWeapon) {
                print("You win! Weapon broke. +$20");
                hasWeapon = false;
                money += 20;
            } else {
                print("u got COOKED");
                health -= 3;
            }
        } else if (input === "run") {

            if (inescapable.includes(res) && !hasShoes) {
                print("ur 2 slow lol");
                health -= 4;
            } else {
                print("You escaped!");
            }

        } else {
            print("GET TROLLED -5 health");
            health -= 5;
        }

        ask();
    };
}

function explore() {

    let res = rand(expResults);

    if (typeof res === "number") {
        print("You found food.");
        food += res;
        ask();
        return;
    }

    if (res === "money") {
        print("You found thirty dollars.");
        money += 30;
        ask();
        return;
    }

    if (res === "weapon") {
        print("You found a weapon.");
        hasWeapon = true;
        ask();
        return;
    }

    if (res === "shoes") {
        print("You found shoes.");
        hasShoes = true;
        ask();
        return;
    }

    if (res === "tnt") {
        print("You found TNT.");
        hasBoom = true;

        if (Math.floor(Math.random() * 5) === 0) {
            print("You also found a map!");
            hasMap = true;
        }

        ask();
        return;
    }

    if (res === "trader") {
        print("Trader found. Buy food? y/n");

        waitingAction = function(input) {

            if (input === "y") {

                while (money >= 10) {
                    money -= 10;
                    food += 3;
                }

                print("Bought food.");
            }

            ask();
        };

        return;
    }

    print("You encountered a " + res + ".");
    print("Fight or run?");

    waitingAction = function(input) {

        if (input === "fight") {

            if (res === "alpha wolf") {

                if (hasBoom) {
                    print("You destroy the Alpha Wolf!");
                    hasBoom = false;
                    hasKey = true;
                    money += 50;
                } else {
                    print("u got COOKED");
                    health -= 5;
                }

            } else {

                if (hasWeapon) {
                    print("You win! Weapon broke. +$30");
                    hasWeapon = false;
                    money += 30;
                } else {
                    print("u got COOKED");
                    health -= 5;
                }
            }

        } else if (input === "run") {

            if (inescapable.includes(res) && !hasShoes) {
                print("ur 2 slow lol");
                health -= 6;
            } else {
                print("You escaped!");
            }

        } else {
            print("GET TROLLED -5 health");
            health -= 5;
        }

        ask();
    };
}

function scavenge() {

    let res = rand(scavResults);

    if (typeof res === "number") {
        print("You found food.");
        food += res;
        ask();
        return;
    }

    if (res === "") {
        print("Nothing found. -2 health.");
        health -= 2;
        ask();
        return;
    }

    if (res === "money") {
        print("You found $50.");
        money += 50;
        ask();
        return;
    }

    if (res === "weapon") {
        print("You found a weapon.");
        hasWeapon = true;
        ask();
        return;
    }

    if (res === "turboShovel") {
        print("You found a turbo shovel!");
        hasTurbo = true;
        ask();
        return;
    }

    if (res === "landmine") {
        print("BOOM. Landmine.");
        health -= 10;
        ask();
        return;
    }

    print("You encountered a " + res + ".");
    print("Fight, pay, or run?");

    waitingAction = function(input) {

        if (input === "fight") {

            if (hasWeapon) {
                print("You win! Weapon broke.");
                hasWeapon = false;
                money += 20;
            } else {
                print("u got COOKED");
                health -= 3;
            }

        } else if (input === "pay") {

            money = 0;
            print("You paid them off.");

        } else if (input === "run") {

            print("You escaped!");

        } else {

            print("GET TROLLED -5 health");
            health -= 5;
        }

        ask();
    };
}

function escapeGame() {

    if (!hasMap) {
        print("You wander endlessly before giving up.");
        ask();
        return;
    }

    if (health < 20) {
        print("You don't feel strong enough.");
        ask();
        return;
    }

    if (!hasKey) {
        print("You need a key.");
        ask();
        return;
    }

    if (!hasPass) {
        print("You need a code.");
        ask();
        return;
    }

    if (food < 40) {
        print("You need more food.");
        ask();
        return;
    }

    if (money < 60) {
        print("You need more money.");
        ask();
        return;
    }

    print("YOU ESCAPED THE FOREST!");
}

print("Welcome to ...");
print("DIG IT o yea");
print("Try to escape the forest!");

ask();</script>

</body>
</html>
</html>
