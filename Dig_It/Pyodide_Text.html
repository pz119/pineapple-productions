<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Console</title>

    <!-- Load Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>

    <style>
        body {
            background: #111;
            color: white;
            font-family: monospace;
            padding: 30px;
        }

        #console {
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            max-width: 800px;
            margin: auto;
        }

        #output {
            white-space: pre-wrap;
            min-height: 300px;
            margin-bottom: 10px;
        }

        #input {
            width: 100%;
            box-sizing: border-box;
            background: #111;
            color: #0f0;
            border: none;
            outline: none;
            font-family: monospace;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div id="console">

    <div id="output">Loading Python...</div>

    <input
        id="input"
        type="text"
        placeholder="Type Python here..."
        disabled
    >

</div>


<script>

let pyodide;

// Get our HTML elements
const output = document.getElementById("output");
const input = document.getElementById("input");


// Start Pyodide
async function startPython() {

    output.textContent = "Loading Python...\n";

    pyodide = await loadPyodide();

    output.textContent += "Python is ready!\n\n";
    output.textContent += ">>> ";

    input.disabled = false;
    input.focus();
}


// Run when user presses Enter
input.addEventListener("keydown", async function(event) {

    if (event.key !== "Enter") {
        return;
    }

    const code = input.value;

    if (!code.trim()) {
        return;
    }

    // Show what the user typed
    output.textContent += code + "\n";

    input.value = "";

    try {

        // Run Python
        const result = await pyodide.runPythonAsync(code);

        // If the expression returned something, display it
        if (result !== undefined && result !== null) {
            output.textContent += result + "\n";
        }

    } catch (error) {

        output.textContent += error + "\n";

    }

    output.textContent += "\n>>> ";

    input.focus();
});


// Start everything
startPython();

</script>

</body>
</html>
