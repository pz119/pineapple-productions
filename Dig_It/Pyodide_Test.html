<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dig It</title>

<style>
    body {
        background: #1e1e1e;
        color: #00ff88;
        font-family: monospace;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: white;
    }

    #console {
        width: 100%;
        height: 400px;
        background: black;
        border: 2px solid #00ff88;
        padding: 10px;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    #inputBox {
        width: 80%;
        padding: 10px;
        font-size: 16px;
        background: #111;
        color: #00ff88;
        border: 2px solid #00ff88;
        box-sizing: border-box;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        background: #00ff88;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #00cc66;
    }

    button:disabled,
    #inputBox:disabled {
        opacity: 0.5;
    }
</style>
</head>

<body>

<h1>Dig It</h1>

<div id="console"></div>

<input
    type="text"
    id="inputBox"
    placeholder="Type here..."
    autocomplete="off"
/>

<button id="enterButton">Enter</button>


<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>


<script>

const consoleBox = document.getElementById("console");
const inputBox = document.getElementById("inputBox");
const enterButton = document.getElementById("enterButton");

let waitingForInput = null;


// --------------------------------------------------
// Print to console
// --------------------------------------------------

function print(text) {

    consoleBox.textContent += text;

    consoleBox.scrollTop =
        consoleBox.scrollHeight;
}


// --------------------------------------------------
// Submit input
// --------------------------------------------------

function submitInput() {

    if (!waitingForInput) {
        return;
    }

    const value = inputBox.value;

    inputBox.value = "";

    // Show what the user entered
    print(value + "\n");

    // Save callback
    const resolve = waitingForInput;

    waitingForInput = null;

    inputBox.disabled = true;
    enterButton.disabled = true;

    // Resume Python
    resolve(value);
}


// --------------------------------------------------
// Enter key
// --------------------------------------------------

inputBox.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            submitInput();
        }
    }
);


enterButton.addEventListener(
    "click",
    submitInput
);


// --------------------------------------------------
// Python input
// --------------------------------------------------

function inputAsync(prompt) {

    return new Promise((resolve) => {

        // Display Python's prompt
        print(prompt);

        waitingForInput = resolve;

        inputBox.disabled = false;
        enterButton.disabled = false;

        inputBox.focus();
    });
}


// --------------------------------------------------
// Start Python
// --------------------------------------------------

async function startPython() {

    try {

        print("Loading Python...\n\n");

        const pyodide =
            await loadPyodide();


        print("Python loaded.\n\n");


        // --------------------------------------------------
        // Make Python's print() go to our console
        // --------------------------------------------------

        pyodide.setStdout({

            batched(text) {

                print(text);
            }

        });


        // --------------------------------------------------
        // Python errors
        // --------------------------------------------------

        pyodide.setStderr({

            batched(text) {

                print(text);
            }

        });


        // --------------------------------------------------
        // Give Python access to inputAsync()
        // --------------------------------------------------

        pyodide.globals.set(
            "browser_input",
            inputAsync
        );


        // --------------------------------------------------
        // Load program.py
        // --------------------------------------------------

        const response =
            await fetch("program.py");


        if (!response.ok) {

            throw new Error(
                "Could not load program.py (" +
                response.status +
                ")"
            );
        }


        const pythonCode =
            await response.text();


        // --------------------------------------------------
        // Execute Python
        // --------------------------------------------------

        await pyodide.runPythonAsync(
            pythonCode,
            {
                filename: "program.py"
            }
        );


        print("\nProgram finished.\n");


    } catch (error) {

        print(
            "\n\nERROR:\n" +
            error.toString() +
            "\n"
        );

        console.error(error);
    }
}


startPython();

</script>

</body>
</html>
