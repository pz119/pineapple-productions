<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dig It</title>

<style>
    body {
        background: #1e1e1e;
        color: #00ff88;
        font-family: monospace;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: white;
    }

    #console {
        width: 100%;
        height: 400px;
        background: black;
        border: 2px solid #00ff88;
        padding: 10px;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    #inputBox {
        width: 80%;
        padding: 10px;
        font-size: 16px;
        background: #111;
        color: #00ff88;
        border: 2px solid #00ff88;
        box-sizing: border-box;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        background: #00ff88;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #00cc66;
    }

    .error {
        color: #ff4444;
    }
</style>
</head>

<body>

<h1>Dig It</h1>

<div id="console">Loading Python...</div>

<input
    type="text"
    id="inputBox"
    placeholder="Type here..."
    autocomplete="off"
/>

<button id="enterButton">Enter</button>


<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>

<script>

const consoleBox = document.getElementById("console");
const inputBox = document.getElementById("inputBox");
const enterButton = document.getElementById("enterButton");


// --------------------------------------------------
// Console output
// --------------------------------------------------

function print(text) {

    consoleBox.textContent += text;

    consoleBox.scrollTop =
        consoleBox.scrollHeight;
}


// --------------------------------------------------
// Start Pyodide
// --------------------------------------------------

async function startPython() {

    try {

        print("\nLoading Python...\n");


        // Load Pyodide
        const pyodide =
            await loadPyodide();


        // --------------------------------------------------
        // Python print()
        // --------------------------------------------------

        pyodide.setStdout({

            batched(text) {

                print(text);

            }

        });


        // --------------------------------------------------
        // Python errors
        // --------------------------------------------------

        pyodide.setStderr({

            batched(text) {

                consoleBox.innerHTML +=
                    `<span class="error">${escapeHtml(text)}</span>`;

                consoleBox.scrollTop =
                    consoleBox.scrollHeight;
            }

        });


        // --------------------------------------------------
        // Python input()
        //
        // This uses the browser's synchronous prompt.
        // It is compatible with normal Python input().
        // --------------------------------------------------

        pyodide.setStdin({

            stdin() {

                const value =
                    window.prompt("");

                if (value === null) {
                    return null;
                }

                return value;
            },

            isatty: true
        });


        // --------------------------------------------------
        // Load program.py
        // --------------------------------------------------

        const response =
            await fetch("program.py");


        if (!response.ok) {

            throw new Error(
                "Could not load program.py (" +
                response.status +
                ")"
            );
        }


        const pythonCode =
            await response.text();


        // --------------------------------------------------
        // Run the COMPLETE Python script
        // --------------------------------------------------

        await pyodide.runPythonAsync(
            pythonCode,
            {
                filename: "program.py"
            }
        );


        print("\nProgram finished.\n");


    } catch (error) {

        consoleBox.innerHTML +=
            `<span class="error">\nERROR:\n${escapeHtml(error.toString())}\n</span>`;

        console.error(error);
    }
}


// --------------------------------------------------
// Prevent HTML in Python output from being interpreted
// --------------------------------------------------

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}


// --------------------------------------------------
// Start
// --------------------------------------------------

startPython();

</script>

</body>
</html>
