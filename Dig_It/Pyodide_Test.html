<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Program</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            margin: 0;
            padding: 30px;
        }

        #console {
            max-width: 900px;
            margin: auto;
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
            box-sizing: border-box;
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .input-line {
            display: flex;
            align-items: baseline;
            white-space: pre-wrap;
        }

        .input-prompt {
            white-space: pre-wrap;
        }

        .input-box {
            flex: 1;
            min-width: 0;

            background: transparent;
            color: white;

            border: none;
            outline: none;

            font-family: monospace;
            font-size: inherit;
        }

        .error {
            color: #ff5555;
            white-space: pre-wrap;
        }

        .status {
            color: #888;
        }
    </style>
</head>

<body>

<div id="console">
    <div id="output">
        <span class="status">Loading Python...</span>
    </div>
</div>


<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>


<script>

const output = document.getElementById("output");


// --------------------------------------------------
// Write text to the console
// --------------------------------------------------

function write(text) {
    output.appendChild(
        document.createTextNode(text)
    );
}


// --------------------------------------------------
// Create an input field
// --------------------------------------------------

function getInput(promptText) {

    return new Promise((resolve) => {

        const line = document.createElement("div");
        line.className = "input-line";


        const prompt = document.createElement("span");
        prompt.className = "input-prompt";
        prompt.textContent = promptText;


        const input = document.createElement("input");
        input.className = "input-box";

        input.type = "text";
        input.autocomplete = "off";
        input.spellcheck = false;


        line.appendChild(prompt);
        line.appendChild(input);

        output.appendChild(line);


        input.focus();


        input.addEventListener("keydown", function(event) {

            if (event.key !== "Enter") {
                return;
            }

            event.preventDefault();


            const value = input.value;


            // Replace the input box with plain text
            const text = document.createTextNode(value);

            line.replaceChild(text, input);


            // Give the answer back
            resolve(value);

        });

    });
}


// --------------------------------------------------
// Start Pyodide
// --------------------------------------------------

async function start() {

    try {

        // Load Pyodide
        const pyodide = await loadPyodide();


        output.innerHTML = "";

        write("Python loaded.\n\n");


        // --------------------------------------------------
        // stdout
        // --------------------------------------------------

        pyodide.setStdout({

            batched: function(text) {

                write(text);

            }

        });


        // --------------------------------------------------
        // stderr
        // --------------------------------------------------

        pyodide.setStderr({

            batched: function(text) {

                const error = document.createElement("div");

                error.className = "error";

                error.textContent = text;

                output.appendChild(error);

            }

        });


        // --------------------------------------------------
        // Load program.py
        // --------------------------------------------------

        const response =
            await fetch("program.py");


        if (!response.ok) {

            throw new Error(
                "Could not load program.py (" +
                response.status +
                ")"
            );

        }


        const pythonCode =
            await response.text();


        // --------------------------------------------------
        // Install our input()
        // --------------------------------------------------

        /*
         * Important:
         *
         * Python's input() is synchronous.
         *
         * The Pyodide Console API provides the
         * proper asynchronous machinery for this.
         */

        const setup = `
from pyodide.console import Console

__browser_console = Console(
    globals=globals()
)
        `;


        await pyodide.runPythonAsync(setup);


        const console =
            pyodide.globals.get(
                "__browser_console"
            );


        // --------------------------------------------------
        // Handle Python output
        // --------------------------------------------------

        console.stdout_callback = function(text) {

            write(text);

        };


        console.stderr_callback = function(text) {

            const error =
                document.createElement("div");

            error.className = "error";

            error.textContent = text;

            output.appendChild(error);

        };


        // --------------------------------------------------
        // Handle input()
        // --------------------------------------------------

        console.stdin_callback = function(prompt) {

            /*
             * This callback is called by Python when
             * input() needs something.
             *
             * The Console API handles the async
             * execution around this callback.
             */

            return getInput(prompt);

        };


        // --------------------------------------------------
        // Run the Python program
        // --------------------------------------------------

        const future =
            console.runsource(
                pythonCode,
                "program.py"
            );


        await future;


        write("\n");


        const status =
            document.createElement("span");

        status.className = "status";

        status.textContent =
            "Program finished.";

        output.appendChild(status);


    } catch (error) {

        output.innerHTML = "";

        const errorElement =
            document.createElement("div");

        errorElement.className = "error";

        errorElement.textContent =
            "ERROR:\n\n" +
            error.toString();

        output.appendChild(errorElement);

        console.error(error);

    }

}


start();

</script>

</body>
</html>
