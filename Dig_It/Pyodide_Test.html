<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Program</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            margin: 0;
            padding: 30px;
        }

        #console {
            max-width: 900px;
            margin: auto;
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .input-line {
            display: flex;
            align-items: baseline;
            white-space: pre-wrap;
        }

        .input-box {
            background: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: monospace;
            font-size: inherit;
            flex: 1;
            min-width: 0;
        }

        .error {
            color: #ff5555;
        }

        .status {
            color: #888;
        }
    </style>
</head>

<body>

<div id="console">
    <div id="output">
        <span class="status">Starting Python...</span>
    </div>
</div>


<script type="module">

const output = document.getElementById("output");


// --------------------------------------------------
// Create the Python worker
// --------------------------------------------------

const worker = new Worker("python-worker.js");


// --------------------------------------------------
// Write text to the console
// --------------------------------------------------

function write(text) {
    output.appendChild(
        document.createTextNode(text)
    );
}


// --------------------------------------------------
// Ask the user for input
// --------------------------------------------------

function createInput(prompt) {

    return new Promise((resolve) => {

        const line = document.createElement("div");
        line.className = "input-line";

        const promptElement = document.createElement("span");
        promptElement.textContent = prompt;

        const input = document.createElement("input");
        input.className = "input-box";
        input.type = "text";
        input.autocomplete = "off";
        input.spellcheck = false;

        line.appendChild(promptElement);
        line.appendChild(input);

        output.appendChild(line);

        input.focus();


        input.addEventListener("keydown", (event) => {

            if (event.key !== "Enter") {
                return;
            }

            event.preventDefault();

            const value = input.value;


            // Turn the input box into normal text
            const text = document.createTextNode(value);

            line.replaceChild(text, input);


            // Give the answer back to Python
            resolve(value);
        });

    });
}


// --------------------------------------------------
// Receive messages from Python
// --------------------------------------------------

worker.onmessage = async (event) => {

    const message = event.data;


    // Python printed something
    if (message.type === "stdout") {

        write(message.text);

        return;
    }


    // Python encountered an error
    if (message.type === "stderr") {

        const error = document.createElement("div");

        error.className = "error";

        error.textContent = message.text;

        output.appendChild(error);

        return;
    }


    // Python wants input()
    if (message.type === "input") {

        const answer = await createInput(message.prompt);

        worker.postMessage({
            type: "input-response",
            value: answer
        });

        return;
    }


    // Python finished
    if (message.type === "finished") {

        write("\n\n");

        const status = document.createElement("span");

        status.className = "status";

        status.textContent = "Program finished.";

        output.appendChild(status);

        return;
    }
};


// --------------------------------------------------
// Start the Python program
// --------------------------------------------------

worker.postMessage({
    type: "run"
});

</script>

</body>
</html>
