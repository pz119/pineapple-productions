<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Program</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            margin: 0;
            padding: 30px;
        }

        #console {
            max-width: 900px;
            margin: auto;
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
            box-sizing: border-box;
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .input-line {
            display: flex;
            align-items: baseline;
            white-space: pre-wrap;
        }

        .input-box {
            flex: 1;
            min-width: 0;
            background: transparent;
            color: white;
            border: none;
            outline: none;
            font-family: monospace;
            font-size: inherit;
        }

        .error {
            color: #ff5555;
            white-space: pre-wrap;
        }

        .status {
            color: #888;
        }
    </style>
</head>

<body>

<div id="console">
    <div id="output">Loading Python...</div>
</div>

<script>

let pyodide;

const output = document.getElementById("output");


// --------------------------------------------------
// Write text
// --------------------------------------------------

function write(text) {
    output.appendChild(
        document.createTextNode(text)
    );
}


// --------------------------------------------------
// Create browser input
// --------------------------------------------------

function browserInput(promptText) {

    return new Promise((resolve) => {

        const line = document.createElement("div");
        line.className = "input-line";

        const prompt = document.createTextNode(promptText);

        const input = document.createElement("input");

        input.className = "input-box";
        input.type = "text";
        input.autocomplete = "off";
        input.spellcheck = false;

        line.appendChild(prompt);
        line.appendChild(input);

        output.appendChild(line);

        input.focus();


        input.addEventListener("keydown", function(event) {

            if (event.key !== "Enter") {
                return;
            }

            event.preventDefault();

            const value = input.value;

            // Replace input box with entered text
            const text =
                document.createTextNode(value);

            line.replaceChild(text, input);

            resolve(value);
        });

    });
}


// --------------------------------------------------
// Main
// --------------------------------------------------

async function main() {

    try {

        // Load Pyodide
        pyodide = await loadPyodide();


        output.textContent = "";

        write("Python loaded.\n\n");


        // --------------------------------------------------
        // stdout
        // --------------------------------------------------

        pyodide.setStdout({

            batched(text) {
                write(text);
            }

        });


        // --------------------------------------------------
        // stderr
        // --------------------------------------------------

        pyodide.setStderr({

            batched(text) {

                const error =
                    document.createElement("div");

                error.className = "error";

                error.textContent = text;

                output.appendChild(error);
            }

        });


        // --------------------------------------------------
        // Custom input()
        // --------------------------------------------------

        pyodide.setStdin({

            stdin(prompt) {

                /*
                 * Python's input() is synchronous.
                 *
                 * browserInput() is asynchronous.
                 *
                 * run_sync() bridges the two.
                 */

                const promise =
                    browserInput(prompt || "");

                return pyodide.ffi.run_sync(
                    promise
                );
            }

        });


        // --------------------------------------------------
        // Load program.py
        // --------------------------------------------------

        const response =
            await fetch("program.py");


        if (!response.ok) {

            throw new Error(
                "Could not load program.py (" +
                response.status +
                ")"
            );
        }


        const pythonCode =
            await response.text();


        // --------------------------------------------------
        // Execute the COMPLETE Python script
        // --------------------------------------------------

        await pyodide.runPythonAsync(
            pythonCode
        );


        write("\n");

        const status =
            document.createElement("span");

        status.className = "status";

        status.textContent =
            "Program finished.";

        output.appendChild(status);


    } catch (error) {

        output.innerHTML = "";

        const errorElement =
            document.createElement("div");

        errorElement.className = "error";

        errorElement.textContent =
            "ERROR:\n\n" +
            error.toString();

        output.appendChild(errorElement);

        console.error(error);
    }
}


main();

</script>

</body>
</html>
