<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dig It</title>

<style>
    body {
        background: #1e1e1e;
        color: #00ff88;
        font-family: monospace;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: white;
    }

    #console {
        width: 100%;
        height: 400px;
        background: black;
        border: 2px solid #00ff88;
        padding: 10px;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    #inputBox {
        width: 80%;
        padding: 10px;
        font-size: 16px;
        background: #111;
        color: #00ff88;
        border: 2px solid #00ff88;
        box-sizing: border-box;
        font-family: monospace;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        background: #00ff88;
        color: black;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #00cc66;
    }

    button:disabled,
    #inputBox:disabled {
        opacity: 0.5;
        cursor: default;
    }

    .error {
        color: #ff4444;
    }

    .status {
        color: #888;
    }
</style>
</head>

<body>

<h1>Dig It</h1>

<div id="console"></div>

<input
    type="text"
    id="inputBox"
    placeholder="Type here..."
    autocomplete="off"
/>

<button id="enterButton">Enter</button>


<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>


<script>

const consoleBox = document.getElementById("console");
const inputBox = document.getElementById("inputBox");
const enterButton = document.getElementById("enterButton");


// ==================================================
// State
// ==================================================

let waitingForInput = null;
let pyodide = null;


// ==================================================
// Console output
// ==================================================

function print(text) {

    consoleBox.textContent += text;

    consoleBox.scrollTop =
        consoleBox.scrollHeight;
}


// ==================================================
// Python input()
// ==================================================

function inputAsync(prompt) {

    return new Promise((resolve) => {

        // Display Python's prompt
        if (prompt) {
            print(prompt);
        }

        // Store the function that will resume Python
        waitingForInput = resolve;

        // Enable input
        inputBox.disabled = false;
        enterButton.disabled = false;

        // Focus the textbox
        inputBox.focus();
    });
}


// ==================================================
// Submit input
// ==================================================

function submitInput() {

    // Don't do anything if Python isn't waiting
    if (!waitingForInput) {
        return;
    }

    const value = inputBox.value;

    // Clear textbox
    inputBox.value = "";

    // Echo the user's input
    print(value + "\n");

    // Get the Promise resolver
    const resolve = waitingForInput;

    // Clear waiting state
    waitingForInput = null;

    // Disable input until Python asks again
    inputBox.disabled = true;
    enterButton.disabled = true;

    // Resume Python
    resolve(value);
}


// ==================================================
// Enter key
// ==================================================

inputBox.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            submitInput();
        }
    }
);


// ==================================================
// Button
// ==================================================

enterButton.addEventListener(
    "click",
    submitInput
);


// ==================================================
// Start Python
// ==================================================

async function startPython() {

    try {

        print("Loading Python...\n");


        // --------------------------------------------------
        // Load Pyodide
        // --------------------------------------------------

        pyodide = await loadPyodide();


        print("Python loaded.\n\n");


        // --------------------------------------------------
        // Redirect Python print() to our console
        // --------------------------------------------------

        pyodide.setStdout({

            batched(text) {

                print(text);
            }

        });


        // --------------------------------------------------
        // Redirect Python errors
        // --------------------------------------------------

        pyodide.setStderr({

            batched(text) {

                const error =
                    document.createElement("span");

                error.className = "error";

                error.textContent = text;

                consoleBox.appendChild(error);

                consoleBox.scrollTop =
                    consoleBox.scrollHeight;
            }

        });


        // --------------------------------------------------
        // Give Python access to our input function
        // --------------------------------------------------

        pyodide.globals.set(
            "browser_input",
            inputAsync
        );


        // --------------------------------------------------
        // Load program.py
        // --------------------------------------------------

        const response =
            await fetch("program.py");


        if (!response.ok) {

            throw new Error(
                "Could not load program.py (" +
                response.status +
                ")"
            );
        }


        const pythonCode =
            await response.text();


        // --------------------------------------------------
        // Run program.py
        // --------------------------------------------------

        await pyodide.runPythonAsync(
            pythonCode
        );


        // --------------------------------------------------
        // Program finished
        // --------------------------------------------------

        print("\n");

        const status =
            document.createElement("span");

        status.className = "status";

        status.textContent =
            "Program finished.";

        consoleBox.appendChild(status);


    } catch (error) {

        consoleBox.innerHTML = "";

        const errorElement =
            document.createElement("span");

        errorElement.className = "error";

        errorElement.textContent =
            "ERROR:\n\n" +
            error.toString();

        consoleBox.appendChild(errorElement);

        console.error(error);
    }
}


// ==================================================
// Start
// ==================================================

startPython();

</script>

</body>
</html>
